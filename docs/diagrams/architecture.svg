</g>
<g data-node="n5_0"><rect x="425.0" y="1356" width="350" height="170" rx="7" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5" />
<svg width="36" height="36" viewBox="0 0 40 40" x="582.0" y="1368" data-purpose-icon="n5_0"><rect x="1" y="1" width="38" height="38" rx="8" fill="white" stroke="#315f8a" stroke-opacity="0.3" /><g transform="translate(8 8)" fill="none" stroke="#315f8a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10" /><path d="m9 7 8 5-8 5V7Z" /></g></svg>
<text x="600.0" y="1428" text-anchor="middle" font-size="16" font-weight="700" fill="#20384f">Separate job execution</text>
<text x="600.0" y="1456" text-anchor="middle" font-size="14" fill="#40556b">Runs the worker to retrieve the external</text>
<text x="600.0" y="1474" text-anchor="middle" font-size="14" fill="#40556b">service's reports.</text>
</g>

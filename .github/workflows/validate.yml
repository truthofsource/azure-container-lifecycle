name: Check the container lifecycle example
on:
  workflow_dispatch:
    inputs:
      build_container:
        description: Build the Linux browser image as well; may take several minutes
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  local-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.2'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -B scripts/check_recipe.py
      - run: npm test
      - run: npm run demo
      - run: python -B -m unittest discover -s scripts -p 'test_*.py' -v
      - run: python -B scripts/demo.py
      - name: Build and verify the browser image only when requested
        if: inputs.build_container
        run: |
          docker build --platform linux/amd64 -t carebridge-lifecycle:local .
          docker run --rm --network none --shm-size=1g carebridge-lifecycle:local src/browser-smoke.mjs
          docker run --rm --network none carebridge-lifecycle:local
